server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway now owns the schema. Hibernate only validates that the
      # entity mappings match the migrated tables (fails fast on drift).
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Versioned schema migrations (src/main/resources/db/migration).
  flyway:
    enabled: true
    baseline-on-migrate: true   # adopt an existing ddl-auto database at V1
    baseline-version: 1

  servlet:
    multipart:
      # Sized for task attachments; avatar uploads (much smaller) share this limit.
      max-file-size: 10MB
      max-request-size: 10MB

# NOTE: SMTP is configured programmatically in EmailConfig from these env vars:
#   MAIL_HOST (default smtp.gmail.com), MAIL_PORT (default 587),
#   MAIL_USERNAME (your Gmail), MAIL_PASSWORD (16-char Gmail App Password).

# Application-specific settings
app:
  name: Taskflow
  frontend:
    # Used to build links in transactional emails (verify / reset).
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  jwt:
    # Base64-encoded 256-bit secret. Override in production via env var APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:c2VjdXJlLXRhc2stbWFuYWdlci1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
    # Short-lived access token lifetime (default 15 min).
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
  refresh:
    # Standard refresh token lifetime (default 7 days).
    expiration-ms: ${APP_REFRESH_EXPIRATION_MS:604800000}
    # Extended lifetime when "remember me" is chosen (default 30 days).
    remember-me-expiration-ms: ${APP_REFRESH_REMEMBER_ME_MS:2592000000}
  verification:
    # Email-verification link lifetime (default 24h).
    expiration-ms: ${APP_VERIFICATION_EXPIRATION_MS:86400000}
  reset:
    # Password-reset link lifetime (default 1h).
    expiration-ms: ${APP_RESET_EXPIRATION_MS:3600000}
  mail:
    # The "From" address. For Gmail this must equal the authenticated account,
    # so it defaults to MAIL_USERNAME.
    from: ${APP_MAIL_FROM:${MAIL_USERNAME:no-reply@taskflow.local}}
  rate-limit:
    # Fixed-window limiter for sensitive auth endpoints.
    auth:
      capacity: ${APP_RATE_LIMIT_AUTH_CAPACITY:10}
      window-seconds: ${APP_RATE_LIMIT_AUTH_WINDOW:60}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  storage:
    # Local-disk file storage (avatars, attachments). Swap StorageService for
    # a cloud-backed bean in production; nothing else needs to change.
    location: ${APP_STORAGE_LOCATION:./uploads}
    base-url: ${APP_STORAGE_BASE_URL:http://localhost:8080/uploads}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
    com.taskmanager: DEBUG
  pattern:
    # Concise, structured console pattern with correlation-friendly context.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n"
